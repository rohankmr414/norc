name: Norc Linux

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip libarchive-tools rpm
          npm ci
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:check -- "$RELEASE_TAG"
      - name: Test migration, Linux compatibility and releases
        run: |
          npm run format:check
          npm test
      - name: Build the latest Notion Calendar as Norc
        env:
          NORC_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run build -- --arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: norc-linux-x64
          if-no-files-found: error
          path: |
            out/release/norc_*.deb
            out/release/norc-*.pkg.tar.xz
            out/release/norc-*.rpm
            out/release/build-info.json
            out/release/SHA256SUMS

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: norc-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: norc-linux-x64
          path: release
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs publish "$RELEASE_TAG" --directory release --resume-draft
