<html>
  <head>
    <style>
      /* Updates to this page (markup, styles, etc.) require an Electron update. */
      /* All `:root` styles are copies of design tokens from `StyleSheet.txt` and updates need to be copied here manually. */
      :root {
        --sans-serif-font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica Neue,
          Helvetica, Arial, sans-serif;

        --white: #fff;
        --gray70: #ededed;
        --gray100: #e5e5e5;
        --gray300: #b2b2b2;
        --gray400: #999999;
        --gray450: #8c8c8c;
        --gray500: #808080;
        --gray600: #666666;
        --gray750: #404040;
        --gray850: #262626;
        --gray900: #1a1a1a;
        --black: #000;

        --material-default: var(--white);
        --text-default: var(--gray900);
        --text-detail: var(--gray400);
        --text-body: var(--gray600);
        --object-default: var(--gray400);
        --object-highlight: var(--gray900);
        --object-active: var(--black);
        --object-highlight-bg: var(--gray70);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --material-default: var(--gray850);
          --text-default: var(--white);
          --text-detail: var(--gray500);
          --text-body: var(--gray300);
          --object-default: var(--gray500);
          --object-highlight: var(--gray100);
          --object-active: var(--white);
          --object-highlight-bg: var(--gray750);
        }
      }

      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: var(--sans-serif-font);
        font-size: 12px;
        line-height: 16px;
        color: var(--text-default);
        background: var(--material-default);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      header {
        position: absolute;
        left: 0;
        top: 0;
        right: 0;
        height: 64px;
        -webkit-app-region: drag;
      }

      .icon {
        color: var(--object-default);
      }

      .headerControls {
        padding: 0px 8px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .offlineIndicator {
        padding: 2px;
        display: flex;
        align-items: center;
        gap: 4px;

        font-size: 10px;
        font-weight: 500;
        line-height: 12px;
        letter-spacing: 0.015em;
      }

      .offlineIndicator svg .Cloud {
        opacity: 0.5;
      }

      .offlineIndicator label {
        color: var(--text-detail);
      }

      #reloadButton {
        appearance: none;
        outline: none;
        border: 0;
        border-radius: 4px;
        width: 20px;
        height: 20px;
        padding: 0;
        background: transparent;
      }

      #reloadButton:hover {
        background: var(--object-highlight-bg);
      }

      #reloadButton:hover svg {
        color: var(--object-highlight);
      }

      #reloadButton:active svg {
        color: var(--object-active);
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .title {
        font-size: 13px;
        font-weight: 500;
      }

      .body {
        color: var(--text-body);
        line-height: 18px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="headerControls">
        <!-- All `<svg>` elements are copies from `assets/` and updates need to be copied here manually. -->
        <svg
          class="icon TrafficLight"
          width="52"
          height="12"
          viewBox="0 0 52 12"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <circle cx="46" cy="6" r="5.5" stroke="currentColor" />
          <circle cx="26" cy="6" r="5.5" stroke="currentColor" />
          <circle cx="6" cy="6" r="5.5" stroke="currentColor" />
        </svg>
        <div class="offlineIndicator">
          <svg
            class="icon CloudSlash"
            idth="16"
            height="16"
            viewBox="0 0 16 16"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              class="Cloud"
              fill-rule="evenodd"
              clip-rule="evenodd"
              d="M11.9786 6.89022L11.8553 8.00523L13 8L13.002 8C14.1057 8.0011 15 8.89611 15 10C15 10.9752 14.3021 11.7873 13.3785 11.9642L14.1753 12.761C15.248 12.3038 16 11.2397 16 10C16 8.57982 15.0132 7.39012 13.6878 7.07922C13.4669 7.02741 13.2367 7 13 7L12.9725 7.00013C12.9862 6.87662 12.9948 6.7516 12.9983 6.62528C12.9994 6.58366 13 6.5419 13 6.5C13 6.44406 12.999 6.38835 12.997 6.33291C12.9929 6.22088 12.9847 6.1099 12.9725 6.00011C12.7239 3.75008 10.8163 2 8.5 2C7.10821 2 5.86399 2.63185 5.03855 3.62434L5.74937 4.33515C6.39074 3.52155 7.38515 3 8.5 3C10.433 3 12 4.567 12 6.5C12 6.63226 11.9927 6.76244 11.9786 6.89022ZM10.5858 12H4C2.34315 12 1 10.6569 1 9C1 7.34315 2.34315 6 4 6C4.06426 6 4.12791 6.00201 4.19092 6.00594L4.61844 6.03266L3.60504 5.01925C1.5813 5.21761 0 6.92414 0 9C0 11.2091 1.79086 13 4 13H11.5858L10.5858 12Z"
              fill="currentColor"
            />
            <path class="Slash" d="M1 2L14 15" stroke="currentColor" stroke-linecap="round" />
          </svg>
          <label>Offline</label>
        </div>
        <button id="reloadButton">
          <svg
            class="icon ArrowClockwise"
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M12.4316 8.21858C12.7036 8.17063 12.9656 8.35233 12.9861 8.6277C13.0578 9.5872 12.8512 10.551 12.3857 11.4011C11.8399 12.3981 10.9708 13.1793 9.92147 13.6161C8.87218 14.0528 7.7054 14.1191 6.61342 13.8039C5.52143 13.4887 4.56942 12.8109 3.91427 11.8822C3.25912 10.9534 2.93994 9.82918 3.00933 8.69474C3.07872 7.5603 3.53253 6.48335 4.29599 5.64138C5.05944 4.79942 6.08697 4.24268 7.20923 4.06293C8.16627 3.90964 9.14349 4.03831 10.0234 4.42768C10.2759 4.53943 10.3592 4.84718 10.2228 5.08728V5.08728C10.0864 5.32739 9.78198 5.40823 9.52674 5.30282C8.84707 5.02215 8.09984 4.93303 7.36738 5.05034C6.46958 5.19414 5.64756 5.63953 5.03679 6.31311C4.42603 6.98668 4.06297 7.84824 4.00746 8.75579C3.95195 9.66335 4.2073 10.5627 4.73141 11.3057C5.25553 12.0487 6.01715 12.591 6.89073 12.8431C7.76432 13.0953 8.69775 13.0423 9.53718 12.6928C10.3766 12.3434 11.0719 11.7184 11.5086 10.9209C11.8648 10.2702 12.0315 9.53641 11.9951 8.80196C11.9814 8.52616 12.1597 8.26654 12.4316 8.21858V8.21858Z"
              fill="currentColor"
            />
            <path d="M10.75 4.75L8 7.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M10.75 4.75L8 2" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </header>
    <main>
      <div class="title">No internet</div>
      <div class="body">Try checking your connection or reconnecting to Wi-Fi</div>
    </main>
    <script>
      function tryReload() {
        if (navigator.onLine) {
          const params = new URLSearchParams(window.location.search);
          const appURL = params.get("appURL");
          window.location = appURL;
        }
      }

      // Wire up reload button.
      const reloadButton = document.getElementById("reloadButton");
      reloadButton.addEventListener("click", tryReload);

      // Automatically try to reload when network returns.
      window.addEventListener("online", tryReload);
    </script>
  </body>
</html>
